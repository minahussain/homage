name: ESLint

on:
    push:
        branches:
            - main # Or your main branch name
    pull_request:
        branches:
            - main # Or your main branch name

jobs:
    eslint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20.x' # Or your desired Node.js version

            - name: Install dependencies
              run: npm ci # Or yarn install --frozen-lockfile if using Yarn

            - name: Run ESLint
              uses: tj-actions/eslint-changed-files@v25 # Or @eslint/github-action or another suitable action
              with:
                  # Example: Report all warnings as errors
                  extra_args: '--max-warnings=0'
                  # Or, if you want a specific warning threshold:
                  # extra_args: "--max-warnings=10"
                  # If you are using a specific config file, specify its path
                  # config_path: "/path/to/eslint.config.mjs"
